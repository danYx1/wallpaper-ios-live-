name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned .app
        run: |
          xcodebuild -project LiveWallpaperApp.xcodeproj -scheme LiveWallpaperApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LiveWallpaperApp.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LiveWallpaperApp.ipa Payload
          rm -rf Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaperApp-ipa
          path: LiveWallpaperApp.ipa
          retention-days: 14ф
