name: LiveWallpaperApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

targets:
  LiveWallpaperApp:
    type: application
    platform: iOS
    sources:
      - LiveWallpaperApp
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Live Wallpapers
        NSPhotoLibraryUsageDescription: "Нужно, чтобы показать ваши живые фото"
        NSPhotoLibraryAddUsageDescription: "Нужно, чтобы сохранить созданное живое фото"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livewallpaperapp
        PRODUCT_NAME: LiveWallpaperApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
